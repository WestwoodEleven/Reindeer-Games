# Builds the iPhone app on a Mac in the cloud and uploads it to TestFlight.
# Run it from GitHub: Actions tab > "iPhone app to TestFlight" > Run workflow.
name: iPhone app to TestFlight
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the secrets are set
        run: |
          [ -n "$TEAM_ID" ] || { echo "::error::Missing secret APPLE_TEAM_ID"; exit 1; }
          [ -n "$KEY_ID" ] || { echo "::error::Missing secret ASC_KEY_ID"; exit 1; }
          [ -n "$ISSUER_ID" ] || { echo "::error::Missing secret ASC_ISSUER_ID"; exit 1; }
          [ -n "${{ secrets.ASC_KEY_P8 }}" ] || { echo "::error::Missing secret ASC_KEY_P8"; exit 1; }

      - name: Use the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Create the iOS project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Name, icon and permission messages
        working-directory: app/ios/App
        run: |
          P=App/Info.plist
          set_str() { /usr/libexec/PlistBuddy -c "Set :$1 $2" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P"; }
          set_str CFBundleDisplayName "Reindeer Games"
          set_str NSCameraUsageDescription "Take photos and videos of your captures to share with the neighborhood."
          set_str NSMicrophoneUsageDescription "Record sound with your capture videos."
          set_str NSPhotoLibraryUsageDescription "Choose photos and videos of your captures to share with the neighborhood."
          set_str NSPhotoLibraryAddUsageDescription "Save photos and videos from the game to your library."
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$P" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          ICON_DIR=App/Assets.xcassets/AppIcon.appiconset
          ICON=$(ls "$ICON_DIR"/*.png | head -1)
          cp ../../resources/icon-1024.png "$ICON"
          echo "Icon written to $ICON"

      - name: Install the App Store Connect key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          F="$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
          # Rebuild the key's line breaks in case they were lost when pasting.
          BODY=$(printf '%s' "$P8" | sed -e 's/-----BEGIN PRIVATE KEY-----//' -e 's/-----END PRIVATE KEY-----//' | tr -d ' \r\n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$F"
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}

      - name: Build the app (signed for the App Store in the next step)
        working-directory: app/ios/App
        run: |
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}. It shows up in App Store Connect > TestFlight after Apple finishes processing it."

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
